<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dravyaguna Digital Monograph</title><style>:root{--m:#541C24;--t:#0B6B4A;--c:#F7F1DE;--p:#FFFDF6;--g:#B07A0A;--i:#2B2925}*{box-sizing:border-box}body{margin:0;background:var(--m);font-family:Arial,sans-serif;color:var(--i)}.shell{max-width:760px;margin:auto;background:var(--p);min-height:100vh}.nav{padding:10px 18px;background:var(--c);font-size:12px}.nav a{color:var(--t);font-weight:800;text-decoration:none}.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}.photo{min-height:140px;background:linear-gradient(145deg,#efe5c8,#d8c99e);display:flex;align-items:center;justify-content:center;text-align:center;font:700 10px monospace;color:#6E4E12}.title{padding:8px 18px 20px}.ey{font-size:10px;color:var(--g);font-weight:700;letter-spacing:.1em}.title h1{font:700 29px Georgia,serif;color:var(--t);margin:7px 0}.authority{font-size:12px;color:#766E63}.section{margin:12px 18px;padding:14px;border:1px solid #ddd7c8;border-radius:10px;background:#fff}.st{font:800 11px monospace;color:var(--t);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}.row{display:grid;grid-template-columns:105px 1fr;padding:9px 0;border-bottom:1px solid #eee7d9;font-size:13px}.k{font:700 10px monospace;color:#B23016}.pending{background:var(--c);border:1px dashed var(--g);border-radius:8px;padding:10px;font-size:12px;line-height:1.5;color:#6E4E12}.refs{font-size:10px;color:#766E63;padding:10px 18px 25px;text-align:center}@media(max-width:480px){.hero{grid-template-columns:1fr 1fr}.row{grid-template-columns:85px 1fr}}</style></head><body><div class="shell"><div class="nav"><a href="../../">← Botanical Garden Home</a></div><div id="app"></div></div><script>const m=location.pathname.match(/\/drug\/(DG\d{3})\/?$/),id=m?m[1]:'';const special=id==='DG099';document.getElementById('app').innerHTML='<div class="hero"><div class="photo">WHOLE PLANT<br>PHOTOGRAPH</div><div class="photo">LEAF / FLOWER<br>PHOTOGRAPH</div><div class="photo">BARK / FRUIT<br>PHOTOGRAPH</div></div><div class="title"><div class="ey">DRAVYAGUNA DIGITAL MONOGRAPH · '+id+'</div><h1>'+ (special?'<i>Terminalia arjuna</i>':'Plant monograph') +'</h1><div class="authority">Ayurvedic Botanical Garden · Digital Drug ID '+id+'</div></div><div class="section"><div class="st">Plant Identity</div><div class="row"><div class="k">Drug ID</div><div>'+id+'</div></div><div class="row"><div class="k">Status</div><div>'+ (special?'Completed prototype — Arjuna':'Structured monograph route created; detailed content pending verification') +'</div></div></div><div class="section"><div class="st">Botanical & Dravyaguna Content</div><div class="pending">Botanical identification, regional names, Rasa–Guna–Veerya–Vipaka, Karma, classical references, formulations, phytochemistry, research evidence and institutional photographs will be added from verified sources. No unsupported content is being generated automatically.</div></div><div class="refs">DRAVYAGUNA KOSHA · '+id+'<br>Permanent route: '+location.pathname+'</div>';document.title=(special?'Arjuna':'Plant '+id)+' — Dravyaguna Digital Monograph';</script></body></html>
