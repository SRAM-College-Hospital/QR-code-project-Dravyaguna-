<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dravyaguna Kosha — Ayurvedic Botanical Garden</title>
<style>
:root{--m:#541C24;--t:#0B6B4A;--c:#F7F1DE;--p:#FFFDF6;--g:#B07A0A;--i:#2B2925}
*{box-sizing:border-box}body{margin:0;background:var(--m);font-family:Arial,sans-serif;color:var(--i)}.shell{max-width:920px;margin:auto;background:var(--p);min-height:100vh}header{padding:32px 22px;background:var(--m);color:#fff}.ey{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#E8D39A;font-weight:700}h1{font:700 32px Georgia,serif;margin:8px 0}.sub{font-size:14px;line-height:1.5}.bar{position:sticky;top:0;z-index:5;padding:16px 18px;background:var(--c);border-bottom:1px solid #ddd2b7}input{width:100%;padding:13px;border:1px solid #cdbf9e;border-radius:10px;font-size:15px}.count{margin-top:8px;font-size:12px;color:#766E63}main{padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #ded7c7;border-radius:11px;padding:13px}.card b{display:block;font:700 10px monospace;color:var(--g)}.card strong{display:block;font:700 18px Georgia,serif;color:var(--t);margin:4px 0}.card i{display:block;font-size:12px}.card small{display:block;font-size:10px;color:#766E63;margin-top:6px}footer{padding:20px;background:var(--c);text-align:center;font-size:11px;color:#766E63}#empty{display:none;padding:30px;text-align:center;color:#766E63}@media(max-width:600px){main{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header><div class="ey">Ayurvedic Botanical Garden</div><h1>Dravyaguna Kosha</h1><div class="sub">Digital guide to the medicinal plants in the institutional botanical garden.</div></header>
<div class="bar"><input id="q" placeholder="Search Sanskrit, English, Hindi, Kannada, botanical name or DG ID…"><div id="n" class="count">Showing 200 plants</div></div>
<main id="grid">__CARDS__</main><div id="empty">No matching plant found.</div><footer>Scan a plant QR code to open its digital monograph.</footer></div>
<script>const q=document.getElementById('q'),a=[...document.querySelectorAll('.card')],n=document.getElementById('n'),e=document.getElementById('empty');q.oninput=()=>{let s=q.value.toLowerCase().trim(),x=0;a.forEach(c=>{let ok=!s||c.dataset.s.includes(s);c.style.display=ok?'':'none';if(ok)x++});n.textContent=`Showing ${x} of 200 plants`;e.style.display=x?'none':'block'};</script></body></html>
