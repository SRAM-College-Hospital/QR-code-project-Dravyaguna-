name: Fix DG001 mobile
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DG001
        shell: python
        run: |
          from pathlib import Path
          p=Path('drug/DG001/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DG001 MOBILE RECTIFICATION v1 */'
          if marker not in s:
              css='''<style>/* DG001 MOBILE RECTIFICATION v1 */
.header{height:92px;padding:7px 24px}
.mark{width:62px;height:62px;transform:scale(.78);transform-origin:center}
.identity{gap:10px}.identity h1{font-size:19px}.identity p{font-size:12px;margin-top:4px}.identity small{font-size:11px}
@media(max-width:800px){
  .header{height:78px;padding:7px 14px;display:flex;align-items:center}
  .identity{gap:7px;width:100%}
  .mark{width:50px;height:50px;flex:0 0 50px;transform:scale(.64)}
  .identity h1{font-size:17px;line-height:1.02}
  .identity p{font-size:11px;line-height:1.12;margin-top:3px}
  .identity small{font-size:10px}
  .hero-image{min-height:300px}
  .plant-info{padding:20px 16px 18px}
  .plant-info h2{font-size:34px;line-height:1.05;max-width:100%;padding-right:0}
  .sanskrit{font-size:27px;margin:6px 0 9px}
  .common{font-size:18px;line-height:1.3}
  .botanical{font-size:20px;margin:9px 0 14px}
  .fact,.property{font-size:13px;min-height:60px;padding:8px 6px}
  .fact b,.property b{font-size:14px}
  .icon{font-size:28px}.property .badge{width:25px;height:25px;font-size:13px;padding-top:4px}
  .intro{font-size:15px;line-height:1.4;padding:10px 12px}
  .medicinal{top:10px;right:10px;width:70px;height:70px;font-size:12px;line-height:1;transform:none;z-index:2}
  .medicinal:before{font-size:22px}
  .plant-info h2{padding-right:78px}
  .modal{position:fixed!important;inset:0!important;z-index:9999!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:8px!important;background:rgba(0,45,35,.72)!important}
  .modal[hidden]{display:none!important}
  .modal-card{position:relative!important;width:calc(100vw - 16px)!important;max-width:720px!important;max-height:calc(100vh - 16px)!important;height:auto!important;overflow:hidden!important;padding:0!important;border:3px solid #e4d77a!important;border-radius:14px!important;display:flex!important;flex-direction:column!important;background:#fffdf7!important}
  .modal-card #modal-body{display:block!important;flex:1 1 auto!important;min-height:0!important;max-height:calc(100vh - 22px)!important;overflow-y:auto!important;overflow-x:hidden!important;padding:20px 16px 26px!important;-webkit-overflow-scrolling:touch!important}
  .modal-card #modal-body h2{font-size:24px!important;line-height:1.15!important;margin:0 42px 14px 0!important}
  .modal-card #modal-body p,.modal-card #modal-body li{font-size:15px!important;line-height:1.5!important}
  .close{position:absolute!important;z-index:3!important;right:7px!important;top:7px!important;width:36px!important;height:36px!important;font-size:25px!important;line-height:36px!important;padding:0!important}
}
@media(max-width:480px){
  .hero-image{min-height:290px}
  .plant-info h2{font-size:32px;padding-right:76px}
  .common{font-size:17px}.botanical{font-size:19px}
  .facts3,.properties{gap:8px}
  .fact,.property{font-size:12.5px}.fact b,.property b{font-size:13.5px}
}
</style>'''
              s=s.replace('</head>',css+'</head>',1)
              fallback='''<script>/* DG001 POPUP FALLBACK v1 */
(function(){
  var fallback={
    overview:['Overview','<p>Mandukaparni (<i>Centella asiatica</i>) is a creeping, spreading herb traditionally valued in Ayurveda for Medhya and Rasayana actions.</p>'],
    morphology:['Morphology','<p><b>Habit:</b> Creeping, spreading herb. <b>Stem:</b> Roots, leaves, flowers and fruits arise at the nodes. <b>Leaves:</b> Kidney-shaped with prominent veins. <b>Flowers:</b> Small, bluish-white to reddish. <b>Fruit:</b> Small clustered fruits. <b>Distribution:</b> India and Sri Lanka, especially moist places.</p>'],
    properties:['Ayurvedic Properties','<p><b>Rasa:</b> Tikta; <b>Anurasa:</b> Kashaya-Madhura; <b>Guna:</b> Laghu, Sara; <b>Virya:</b> Shita; <b>Vipaka:</b> Madhura; <b>Prabhava:</b> Medhya.</p>'],
    uses:['Therapeutic Uses','<p>Traditionally described in relation to nervous, digestive, respiratory, urinary and skin disorders, and for general debility.</p>'],
    chemistry:['Phytoconstituents','<p>The source reports an alkaloidal constituent named Brahmin, together with volatile oil and other constituents reported from the leaves.</p>'],
    formulations:['Formulations','<p>Brahmi-paka, Brahmi-panaka, Saraswatarishta, Saraswata-ghrita, Brahmi-taila, Brahmi-sattva and Brahmi-malhara.</p>'],
    dose:['Dose and Administration','<p>Panchanga is the part used. Historical dosage units in the source are retained for reference and are not modern prescribing instructions.</p>'],
    references:['Classical References','<p>Mandukaparni is cited in Sushruta Samhita, Bhavaprakasha and Charaka Samhita in Ayurvedic Medhya and Rasayana contexts.</p>'],
    research:['Research Insights','<p>This section can present verified modern pharmacological, phytochemical and molecular-docking findings for Mandukaparni.</p>']
  };
  function getData(k){try{if(typeof details!=='undefined' && details[k]) return details[k];}catch(e){} try{if(typeof D!=='undefined' && D[k]){var x=D[k];return [x.title||x[0],x.html||x[1]]}}catch(e){} return fallback[k]||fallback.overview;}
  function openFixed(k){
    var m=document.getElementById('detail-modal'), b=document.getElementById('modal-body');
    if(!m||!b)return;
    var d=getData(k), title=d.title||d[0], html=d.html||d[1];
    b.innerHTML='<h2 id="modal-title">'+title+'</h2>'+html;
    m.hidden=false; m.setAttribute('aria-hidden','false'); b.scrollTop=0; document.body.style.overflow='hidden';
  }
  function closeFixed(){var m=document.getElementById('detail-modal');if(m){m.hidden=true;m.setAttribute('aria-hidden','true')}document.body.style.overflow='';}
  document.addEventListener('click',function(e){
    var btn=e.target.closest ? e.target.closest('.side button,[data-topic]') : null;
    if(!btn)return;
    e.preventDefault(); e.stopImmediatePropagation();
    var k=btn.getAttribute('data-topic');
    if(!k){var t=(btn.textContent||'').toLowerCase(); if(t.indexOf('morphology')>=0)k='morphology';else if(t.indexOf('properties')>=0)k='properties';else if(t.indexOf('therapeutic')>=0)k='uses';else if(t.indexOf('phytoconstituents')>=0)k='chemistry';else if(t.indexOf('formulations')>=0)k='formulations';else if(t.indexOf('dose')>=0)k='dose';else if(t.indexOf('classical')>=0)k='references';else if(t.indexOf('research')>=0)k='research';else k='overview';}
    openFixed(k);
  },true);
  document.addEventListener('click',function(e){if(e.target.id==='detail-modal')closeFixed();if(e.target.closest && e.target.closest('.modal .close'))closeFixed();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeFixed();});
})();</script>'''
              s=s.replace('</body>',fallback+'</body>',1)
              p.write_text(s,encoding='utf-8')
          else:
              print('Already patched')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drug/DG001/index.html .github/workflows/fix-dg001.yml
          git commit -m "Fix DG001 mobile layout and popups" || exit 0
          git rm .github/workflows/fix-dg001.yml
          git commit -m "Remove temporary DG001 fix workflow"
          git push
