name: Apply monograph UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update monograph HTML
        shell: python
        run: |
          from pathlib import Path
          import re
          changed=[]
          for path in Path('drug').glob('*/index.html'):
              text=path.read_text(encoding='utf-8')
              original=text
              text=re.sub(r'<div class="actions"[\s\S]*?</div>\s*</section>', '</section>', text, count=1)
              if 'class="modal-card"' in text and 'data-full-popup-fix' not in text:
                  css='''<style data-full-popup-fix>
          .modal{padding:10px;overflow:hidden}
          .modal-card{width:min(720px,calc(100vw - 20px));max-width:720px;max-height:88vh;overflow:hidden;padding:0;display:flex;flex-direction:column}
          .modal-card #modal-body{display:block;max-height:88vh;overflow-y:auto;overflow-x:hidden;padding:24px 22px 30px;-webkit-overflow-scrolling:touch}
          .modal-card #modal-body h2{margin:0 48px 18px 0}
          .modal-card #modal-body p,.modal-card #modal-body li{font-size:16px;line-height:1.55}
          </style>'''
                  text=text.replace('</head>',css+'</head>',1)
              if 'const details=' in text and 'data-popup-content-fix' not in text:
                  js='''<script data-popup-content-fix>
          document.querySelectorAll('[data-topic]').forEach(function(btn){
            btn.addEventListener('click',function(){
              setTimeout(function(){
                var d=(typeof details!=='undefined') ? details[btn.dataset.topic] : null;
                if(d && typeof body!=='undefined' && typeof modal!=='undefined'){
                  body.innerHTML='<h2 id="modal-title">'+d.title+'</h2>'+d.html;
                  modal.hidden=false;
                }
              },10);
            });
          });
          </script>'''
                  text=text.replace('</body>',js+'</body>',1)
              if text!=original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(str(path))
          print('Changed:',changed)
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drug/*/index.html
          git commit -m "Remove monograph resource cards and fix full popups"
          git push
