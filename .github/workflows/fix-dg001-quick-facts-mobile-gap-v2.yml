name: Fix DG001 Quick Facts Mobile Gap v2
on:
  push:
    paths:
      - '.github/workflows/fix-dg001-quick-facts-mobile-gap-v2.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile Quick Facts column spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('drug/DG001/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          patch = '''<style id="dg001-quick-facts-mobile-gap-v2">
          @media(max-width:480px){
            .overview-restored .quick dl{grid-template-columns:145px minmax(0,1fr)!important;column-gap:24px!important;row-gap:4px!important;margin-left:10px!important;margin-right:10px!important;font-size:13px!important}
            .overview-restored .quick dt{min-width:0!important;white-space:nowrap!important;text-align:left!important}
            .overview-restored .quick dd{min-width:0!important;white-space:nowrap!important;text-align:left!important}
          }
          </style>
          '''
          if 'dg001-quick-facts-mobile-gap-v2' not in s:
              s = s.replace(marker, patch + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "SRAMCH"
          git config user.email "ramakrishna.shanbhoge@gmail.com"
          git add drug/DG001/index.html
          git diff --cached --quiet || git commit -m "Fix DG001 mobile Quick Facts column gap"
          git push
