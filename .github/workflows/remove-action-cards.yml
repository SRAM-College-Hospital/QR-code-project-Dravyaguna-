name: Remove monograph action cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove action cards
        shell: python
        run: |
          from pathlib import Path
          import re
          changed=[]
          for path in Path('drug').glob('*/index.html'):
              text=path.read_text(encoding='utf-8')
              original=text
              text=re.sub(r'<div class="actions"[\s\S]*?</section>', '</section>', text, count=1)
              if text != original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(str(path))
          print('Changed:', changed)
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drug/*/index.html
          git commit -m "Remove monograph action cards"
          git push
