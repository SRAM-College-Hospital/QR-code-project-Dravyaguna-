name: Fix DG001 Quick Facts Gap
on:
  push:
    paths:
      - '.github/workflows/fix-dg001-quick-facts-gap.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Quick Facts spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('drug/DG001/index.html')
          s = p.read_text()
          old = ".quick dl{margin:8px 12px 12px;display:grid;grid-template-columns:150px 1fr;gap:4px;font-size:14px}.quick dt,.quick dd{white-space:nowrap}"
          new = ".quick dl{margin:8px 12px 12px;display:grid;grid-template-columns:150px 1fr;column-gap:18px;row-gap:4px;font-size:14px}.quick dt,.quick dd{white-space:nowrap;text-align:left}"
          if old not in s:
              raise SystemExit('Expected Quick Facts CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drug/DG001/index.html
          git commit -m 'Fix DG001 Quick Facts spacing'
          rm .github/workflows/fix-dg001-quick-facts-gap.yml
          git add -A
          git commit -m 'Remove temporary Quick Facts workflow'
          git push
