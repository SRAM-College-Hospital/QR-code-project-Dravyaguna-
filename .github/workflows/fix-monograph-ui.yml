name: Fix monograph UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monograph UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in Path('drug').glob('*/index.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Remove the four resource/action cards at the bottom of the interactive monograph.
              text = re.sub(
                  r'<div class="actions"[\\s\\S]*?</div>\\s*</section>',
                  '</section>',
                  text,
                  count=1,
              )

              # Make the existing popup reliably show all section content on mobile and desktop.
              if 'class="modal-card"' in text and '#modal-body' not in text:
                  override = '''<style>
          .modal{padding:14px;overflow:hidden}
          .modal-card{width:min(720px,calc(100vw - 28px));max-width:720px;max-height:88vh;height:auto;overflow:hidden;padding:0;display:flex;flex-direction:column}
          .modal-card #modal-body{overflow-y:auto;overflow-x:hidden;padding:28px 30px 30px;max-height:88vh;-webkit-overflow-scrolling:touch}
          .modal-card #modal-body h2{margin:0 48px 18px 0}
          .modal-card #modal-body p,.modal-card #modal-body li{font-size:16px;line-height:1.55}
          @media(max-width:480px){
            .modal{padding:10px}
            .modal-card{width:calc(100vw - 20px);max-height:88vh;border-width:3px;border-radius:14px}
            .modal-card #modal-body{padding:24px 20px 26px;max-height:88vh}
            .modal-card #modal-body h2{font-size:26px;margin-right:44px}
            .modal-card #modal-body p,.modal-card #modal-body li{font-size:15px;line-height:1.55}
          }
          </style>'''
                  text = text.replace('</head>', override + '</head>', 1)

              # Add a small safety layer so a topic click always renders its complete detail object.
              if 'const details=' in text and 'data-popup-safety-fix' not in text:
                  safety = '''<script data-popup-safety-fix>
          document.querySelectorAll('[data-topic]').forEach(function(btn){
            btn.addEventListener('click',function(){
              window.setTimeout(function(){
                var key=btn.dataset.topic;
                if(typeof details!=='undefined' && details[key]){
                  body.innerHTML='<h2 id="modal-title">'+details[key].title+'</h2>'+details[key].html;
                  modal.hidden=false;
                }
              },0);
            });
          });
          </script>'''
                  text = text.replace('</body>', safety + '</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drug/*/index.html
          git commit -m "Fix monograph resource cards and popups"
          git push
