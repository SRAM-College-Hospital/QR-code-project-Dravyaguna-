name: Restore DG001 overview sections
on:
  push:
    paths:
      - TEMP-DG001-RESTORE-OVERVIEW.txt
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore overview, highlights and quick facts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('drug/DG001/index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="dg001-restored-overview"' in s:
              raise SystemExit(0)
          start=s.index('<section class="main topic-grid"')
          end=s.index('</section>', start)+len('</section>')
          cards=s[start:end]
          overview='''<section class="overview-restored" id="dg001-restored-overview" aria-label="Mandukaparni overview"><article class="overview"><div class="quote">“Nourishing<br>Mind, Body<br>and Life”</div><h2>Overview</h2><p>Mandukaparni (<em>Centella asiatica</em>) is a perennial, creeping herb widely found in moist and shady places. It is a well-known <em>Medhya</em> (brain tonic) and <em>Rasayana</em> drug in Ayurveda. Traditionally used for enhancing memory, intellect and longevity, it is also valued for its wound healing, anti-inflammatory and neuroprotective properties.</p><div class="lists"><section class="box high"><h3>🌿 &nbsp;Key Highlights</h3><ul><li>Classical Ayurvedic Medhya Rasayana</li><li>Supports memory and cognitive function</li><li>Useful in skin disorders and wound healing</li><li>Adaptogenic and anti-stress properties</li><li>Widely studied for neuroprotective and antioxidant effects</li></ul></section><section class="box quick"><h3>🌺 &nbsp;Quick Facts</h3><dl><dt>Sanskrit Name</dt><dd>Mandukaparni</dd><dt>Botanical Name</dt><dd><em>Centella asiatica</em> (L.) Urb.</dd><dt>Family</dt><dd>Apiaceae</dd><dt>Common Name</dt><dd>Indian Pennywort, Gotu Kola</dd><dt>Hindi Name</dt><dd>Manduki</dd><dt>Kannada Name</dt><dd>Ondelaga</dd><dt>Part Used</dt><dd>Panchanga (whole plant)</dd><dt>Plant Type</dt><dd>Perennial, creeping herb</dd><dt>Habitat</dt><dd>Moist, shady areas</dd></dl></section></div></article></section>'''
          s=s[:start]+overview+'\n'+cards+s[end:]
          css='''<style id="dg001-restored-overview-css">.overview-restored{padding:0 15px 14px;background:var(--cream)}.overview-restored .overview{padding-top:8px;position:relative}.overview-restored .overview h2{margin:0 0 11px;color:#073d31;font-size:28px}.overview-restored .overview h2:before{content:'◒';color:#267443;margin-right:18px}.overview-restored .overview>p{margin:0;max-width:605px;font-size:18px;line-height:1.38}.overview-restored .quote{position:absolute;right:0;top:4px;width:151px;min-height:174px;padding:75px 17px 14px;border-radius:12px;background:linear-gradient(135deg,#e8f5d2,#d7e8be);font-size:18px;text-align:center;line-height:1.24}.overview-restored .quote:before{content:'⌁';position:absolute;top:12px;left:55px;color:#267443;font-size:57px}.overview-restored .lists{display:grid;grid-template-columns:1.1fr .9fr;gap:11px;margin-top:19px}.overview-restored .box{border:1px solid #d5dbc8;border-radius:10px;overflow:hidden}.overview-restored .box h3{margin:0;padding:8px 13px;font-size:17px}.overview-restored .high h3{background:#dcebcf}.overview-restored .quick h3{background:#f5d7d3}.overview-restored .box ul{margin:8px 0;padding:0 15px 8px 51px;font-size:15px;line-height:1.43}.overview-restored .box li{margin:8px 0}.overview-restored .high li::marker{content:'●  ';color:#208144}.overview-restored .quick dl{margin:8px 12px 12px;display:grid;grid-template-columns:126px 1fr;gap:4px;font-size:14px}.overview-restored .quick dt{font-weight:normal}.overview-restored .quick dt:before{content:'✧';color:#a44a42;margin-right:9px}.overview-restored .quick dd{margin:0}@media(max-width:800px){.overview-restored{padding:0 12px 12px}.overview-restored .quote{display:none}.overview-restored .overview>p{font-size:16px}.overview-restored .lists{grid-template-columns:1fr;gap:10px}}@media(max-width:480px){.overview-restored{padding:0 10px 10px}.overview-restored .overview h2{font-size:24px}.overview-restored .box ul{font-size:14px;padding-left:42px}.overview-restored .quick dl{grid-template-columns:112px 1fr;font-size:13px}}</style>'''
          head=s.index('</head>')
          s=s[:head]+css+'\n'+s[head:]
          p.write_text(s,encoding='utf-8')
          Path('TEMP-DG001-RESTORE-OVERVIEW.txt').unlink()
          Path('.github/workflows/dg001-restore-overview.yml').unlink()
          PY
      - name: Commit restoration and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drug/DG001/index.html .github/workflows/dg001-restore-overview.yml TEMP-DG001-RESTORE-OVERVIEW.txt
          git commit -m "Restore DG001 overview sections and quick facts"
          git push
